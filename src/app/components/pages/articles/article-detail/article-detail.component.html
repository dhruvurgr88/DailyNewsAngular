<div class="container mt-4" *ngIf="!loading && article">
  <h2>{{ article.title }}</h2>
  <p><small class="text-muted">Published: {{ article.createdDate | date }}</small></p>
  <img *ngIf="article.imageUrl" [src]="article.imageUrl" class="img-fluid mb-3">
  <p>{{ article.content }}</p>

  <div class="mt-3">
    <button class="btn btn-success me-2" (click)="likeArticle()" [ngModel]="likesCount">👍 Likes ({{likesCount}})</button>
    <button class="btn btn-primary me-2" (click)="openCommentBox()">💬 Comment</button>
    <button class="btn btn-info me-2" (click)="shareArticle()">🔗 Share</button>
    <button class="btn btn-danger" (click)="reportArticle()">⚠️ Report</button>
    <button class="btn btn-danger me-2 ms-2" *ngIf="role === 'Journalist'" (click)="sendForReview(article.id)">
      Send for Review
    </button>

    <button class="btn btn-danger ms-2" *ngIf="role === 'Editor'" (click)="deleteArticle(article.id)">
      Delete Article
    </button>

  </div>
  <div *ngIf="showCommentBox" class="mt-3">
    <textarea class="form-control mb-2"
              rows="3"
              placeholder="Write your comment..."
              [(ngModel)]="commentText"
              >
    </textarea>
    <button class="btn btn-primary btn-sm" (click)="submitComment()" >Submit Comment</button>
  </div>

  <!-- Comments Section -->
  <div class="mt-4">
    <h5>Comments</h5>
    <div *ngFor="let comment of comments" class="mb-2">

      <strong>{{ comment.userEmail }}</strong>: {{ comment.commentText }}
    </div>
  </div>
</div>

<div *ngIf="loading" class="alert alert-info">Loading article...</div>
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
