<div class="container mt-4" style="max-width: 400px;">
  <h3 class="text-center mb-3">🔐 Login</h3>

  <!-- ✅ Alerts -->
  <div *ngIf="alertType === 'success'" class="alert alert-success alert-dismissible fade show" role="alert">
    {{ alertMessage }}
    <button type="button" class="btn-close" (click)="closeAlert()" aria-label="Close"></button>
  </div>

  <div *ngIf="alertType === 'error'" class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ alertMessage }}
    <button type="button" class="btn-close" (click)="closeAlert()" aria-label="Close"></button>
  </div>

  <div *ngIf="alertType === 'warning'" class="alert alert-warning alert-dismissible fade show" role="alert">
    {{ alertMessage }}
    <button type="button" class="btn-close" (click)="closeAlert()" aria-label="Close"></button>
  </div>

  <!-- 🌀 Funny Loader -->
  <div *ngIf="loading" class="funny-loader text-center mt-5">
    <div class="spinner"></div>
    <p class="mt-3 fs-5">
      🧠 Logging you in… <br />
      Brewing digital coffee ☕ <br />
      Almost there 🚀
    </p>
  </div>

  <!-- ✅ Login Form -->
  <form *ngIf="loading || !alreadyLoggedIn" (ngSubmit)="login()">
    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" class="form-control" [(ngModel)]="password" name="password" required />
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
      <span *ngIf="!loading">Login</span>
      <span *ngIf="loading">⏳ Logging in...</span>
    </button>
  </form>
</div>
